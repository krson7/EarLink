<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>이어링크 — 실시간 수어 인식 (M5)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #0f172a; color: #e2e8f0;
                 font-family: -apple-system, "Apple SD Gothic Neo", sans-serif; }
    body { display: flex; flex-direction: column; align-items: center; }

    header { padding: 10px 16px; font-size: 16px; font-weight: 700; align-self: flex-start; }
    header small { font-weight: 400; color: #94a3b8; margin-left: 8px; }

    #banner { position: fixed; top: 0; left: 0; right: 0; z-index: 30;
              background: #dc2626; color: #fff; padding: 10px 16px;
              font-size: 14px; text-align: center; }

    main { flex: 1; display: flex; align-items: center; justify-content: center;
           width: 100%; padding: 8px; }
    #stage { position: relative; max-width: 960px; width: 100%; }
    #stage video { display: block; width: 100%; height: auto; border-radius: 12px;
                   background: #000; }
    #stage canvas { position: absolute; inset: 0; width: 100%; height: 100%;
                    pointer-events: none; }
    .mirror { transform: scaleX(-1); }

    #hud { position: fixed; top: 10px; right: 10px; z-index: 20;
           background: rgba(15, 23, 42, .75); border: 1px solid #334155;
           border-radius: 8px; padding: 8px 12px; font-size: 12px;
           font-family: ui-monospace, Menlo, monospace; line-height: 1.7;
           min-width: 130px; }
    #statusDot { display: inline-block; width: 8px; height: 8px; border-radius: 50%;
                 background: #64748b; margin-right: 6px; }
    #statusDot.ok { background: #22c55e; }
    #statusDot.bad { background: #f59e0b; }

    #flipBtn { position: fixed; bottom: max(20px, env(safe-area-inset-bottom)); left: 50%;
               transform: translateX(-50%); z-index: 20;
               padding: 12px 24px; font-size: 15px; border: none; border-radius: 999px;
               background: #2563eb; color: #fff; cursor: pointer; }
    #flipBtn:active { background: #1d4ed8; }
    #flipBtn:disabled { opacity: .5; }

    #recDot { position: absolute; top: 10px; left: 10px; z-index: 15;
              display: flex; align-items: center; gap: 8px;
              background: rgba(15, 23, 42, .75); border-radius: 999px;
              padding: 6px 14px; font-size: 13px; font-weight: 600; }
    #recDot .dot { width: 10px; height: 10px; border-radius: 50%;
                   background: #ef4444; animation: pulse 1s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }

    #results { position: fixed; left: 10px;
               bottom: max(20px, env(safe-area-inset-bottom)); z-index: 20;
               max-width: 40vw; min-width: 150px; max-height: 30vh;
               overflow-y: auto; background: rgba(15, 23, 42, .75);
               border: 1px solid #334155; border-radius: 8px; padding: 8px 12px; }
    #results:empty { display: none; }
    #results .entry { font-size: 20px; font-weight: 700; padding: 3px 0; }
    #results .entry small { font-size: 12px; font-weight: 400; color: #94a3b8; }
    #results .entry.miss { color: #64748b; font-size: 14px; font-weight: 400; }

    #ttsBtn { position: fixed; right: 10px;
              bottom: max(20px, env(safe-area-inset-bottom)); z-index: 20;
              width: 48px; height: 48px; font-size: 22px; border: 1px solid #334155;
              border-radius: 50%; background: rgba(15, 23, 42, .75); cursor: pointer; }

    #modeBtn { position: fixed; top: 10px; right: 150px; z-index: 20;
               padding: 8px 16px; font-size: 14px; font-weight: 600; border: none;
               border-radius: 999px; background: #7c3aed; color: #fff; cursor: pointer; }
    #modeBtn:active { background: #6d28d9; }

    /* 지문자 모드 조합 표시 (중앙 상단, 단어 모드에선 숨김) */
    #jamoPanel { position: fixed; top: 60px; left: 50%; transform: translateX(-50%);
                 z-index: 20; text-align: center; background: rgba(15, 23, 42, .8);
                 border: 1px solid #334155; border-radius: 12px; padding: 10px 24px;
                 min-width: 200px; }
    #jamoPanel[hidden] { display: none; }
    #composed { font-size: 40px; font-weight: 700; min-height: 48px; color: #e2e8f0; }
    #curJamo { font-size: 15px; color: #a78bfa; margin-top: 4px; }
  </style>
</head>
<body>
  <header>이어링크 <small>실시간 수어 인식 — 연구 시제품</small></header>
  <div id="banner" hidden></div>
  <main>
    <div id="stage">
      <video id="video" autoplay muted playsinline></video>
      <canvas id="overlay"></canvas>
      <div id="recDot" hidden><span class="dot"></span>수어 인식 중</div>
    </div>
  </main>
  <div id="jamoPanel" aria-live="polite">
    <div id="composed"></div>
    <div id="curJamo">–</div>
  </div>
  <div id="results" aria-live="polite"></div>
  <!-- 단어 모드 UI 숨김 (지문자 기본). 복원: hidden 제거 + app.js mode="word" -->
  <button id="modeBtn" title="단어/지문자 모드 전환" hidden>단어 모드</button>
  <button id="ttsBtn" title="음성 출력 켜기/끄기">🔊</button>
  <div id="hud">
    <div><span id="statusDot"></span><span id="statusText">초기화 중…</span></div>
    <div>frames: <span id="hudFrames">0</span></div>
    <div>RTT: <span id="hudRtt">–</span> ms</div>
    <div>dims: <span id="hudDims">0</span></div>
    <div>feat: <span id="hudFeat">–</span></div>
    <div>mode: <span id="hudMode">–</span></div>
  </div>
  <button id="flipBtn" hidden>카메라 전환</button>
  <script type="module" src="app.js"></script>
</body>
</html>
