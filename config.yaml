# 이어링크(EarLink) 설정
server:
  host: 0.0.0.0        # 스마트폰/터널 테스트를 위해 모든 인터페이스 바인딩
  port: 8000

# 지문자 모드 — 재학습 시 model_path 와 server/fingerspelling.ACTIONS 만 교체
fingerspelling:
  model_path: "models/fingerspelling/multi_hand_gesture_classifier.tflite"
  seq_len: 10              # tflite 입력 시퀀스 길이 (모델 고정)
  conf_threshold: 0.9      # 자모 확정 confidence 임곗값
  # 같은 자모를 N프레임(~0.6초 @15fps) 유지해야 확정. 연속 같은 자모(학교의 ㄱㄱ)는
  # 사이에 손을 잠깐 내렸다 올리면 재확정된다. 답답하면 낮추고, 오확정 잦으면 높인다.
  confirm_frames: 9
